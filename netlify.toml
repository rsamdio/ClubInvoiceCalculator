# Netlify Configuration for Rotaract Club Invoice Calculator
# https://dues.rsamdio.org

# ------------------------------------------------------------------------------
# Redirect Rules
# ------------------------------------------------------------------------------

# Proxy Firebase Auth requests to Firebase under the custom domain
[[redirects]]
  from = "/__/auth/*"
  to = "https://clubinvoicecalculator.firebaseapp.com/__/auth/:splat"
  status = 200
  force = true

# Redirect default Netlify subdomain to primary domain
[[redirects]]
  from = "https://rotaractdues.netlify.app/*"
  to = "https://dues.rsamdio.org/:splat"
  status = 301
  force = true

# ------------------------------------------------------------------------------
# Header Rules
# ------------------------------------------------------------------------------

# 1. Do not cache Firebase Auth proxy responses
[[headers]]
  for = "/__/auth/*"
  [headers.values]
    Cache-Control = "no-cache, no-store, must-revalidate"

# 2. Public / Default Site Headers (Calculator & Learn)
[[headers]]
  for = "/*"
